DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift Travels</title>
    <meta name="description" content="Explore the world with Swift Travels - your trusted travel partner.">
    <meta name="keywords" content="Travel, Destinations, Tours, Flights, Hotels">
    <meta name="author" content="Swift Travels">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css"> <!-- Replace with your CSS file -->

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- FontAwesome for Icons -->
    <script src="https://kit.fontawesome.com/your-kit-id.js" crossorigin="anonymous"></script>

    <!-- Global Styles -->
    <style>
        /* Reset default margin and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Navigation Bar */
        .navbar {
            background-color: #333;
            padding: 15px;
            text-align: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .logo {
            height: 50px;
            margin-left: 20px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            display: inline-block;
            transition: background-color 0.3s ease;
        }

        .nav-links a:hover {
            background-color: #555;
        }

        /* Dropdown Menu */
        .dropdown-menu {
            display: none;
            position: absolute;
            background-color: #444;
            top: 40px;
            left: 0;
            list-style: none;
            padding: 0;
            border-radius: 5px;
        }
        .dropdown-menu li a {
            padding: 10px;
            display: block;
        }
        .nav-links li:hover .dropdown-menu {
            display: block;
        }

        /* Search Bar */
        .search-bar {
            margin-right: 20px;
        }
        .search-bar input {
            padding: 7px;
            border: none;
            border-radius: 5px;
            width: 180px;
        }
        .search-bar button {
            padding: 7px;
            border: none;
            background-color: #ff6600;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        /* Mobile Menu */
        .menu-toggle {
            display: none;
            font-size: 24px;
            cursor: pointer;
            color: white;
            margin-right: 20px;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                background: #333;
                width: 100%;
            }
            .nav-links.active {
                display: flex;
            }
            .menu-toggle {
                display: block;
            }
        }

        /* Footer */
        .footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>

    <!-- Global JavaScript -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelector('.menu-toggle').addEventListener('click', function() {
                document.querySelector('.nav-links').classList.toggle('active');
            });
        });
    </script>
</head>
<body>

    <!-- Global Navigation Bar -->
    <div class="navbar">
        <img src="path-to-your-logo.png" alt="Swift Travels Logo" class="logo">
        <span class="menu-toggle">&#9776;</span>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li>
                <a href="#">Destinations ▼</a>
                <ul class="dropdown-menu">
                    <li><a href="europe.html">Europe</a></li>
                    <li><a href="asia.html">Asia</a></li>
                    <li><a href="africa.html">Africa</a></li>
                    <li><a href="america.html">America</a></li>
                </ul>
            </li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="search-bar">
            <input type="text" placeholder="Search...">
            <button>Go</button>
        </div>
    </div>

    <!-- Main Content -->
    <main style="margin-top: 80px; padding: 20px;">
        <h1>Welcome to Swift Travels</h1>
        <p>Explore amazing destinations around the world with us.</p>
    </main>

    <!-- Footer Section -->
    <footer class="footer">
        <p>&copy; 2025 Swift Travels. All rights reserved.</p>
    </footer>

    <!-- JavaScript for Mobile Menu -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelector('.menu-toggle').addEventListener('click', function() {
                document.querySelector('.nav-links').classList.toggle('active');
            });
        });
    </script>

</body>
</html>
